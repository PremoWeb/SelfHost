<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
		<script>
			// Check user preference from persistence
			const mode = localStorage.getItem('mode-watcher-mode');
			const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

			// Apply initial theme
			const shouldUseDark = mode === 'dark' || ((!mode || mode === 'system') && system === 'dark');
			
			if (shouldUseDark) {
				document.documentElement.classList.add('dark');
				document.documentElement.style.backgroundColor = '#09090b'; // zinc-950
			} else {
				document.documentElement.classList.remove('dark');
				document.documentElement.style.backgroundColor = '#ffffff';
			}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-background text-foreground">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
